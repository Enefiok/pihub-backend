<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIHUB Newsletter</title>
<style>
  body, table, td { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
  table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
  img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; }
  body { margin: 0; padding: 0; width: 100% !important; background-color: #f2f2f2; font-family: Arial, Helvetica, sans-serif; }

  a.social-icon:hover { background-color: #FF5A1F !important; }
  a.social-icon:hover svg path,
  a.social-icon:hover svg rect,
  a.social-icon:hover svg circle { fill: #ffffff !important; stroke: #ffffff !important; }

  @media only screen and (max-width: 600px) {
    .email-container { width: 100% !important; }
    .fluid-padding { padding-left: 20px !important; padding-right: 20px !important; }
  }
</style>
</head>
<body style="margin:0; padding:0; background-color:#f2f2f2;">

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f2f2f2;">
    <tr>
      <td align="center" style="padding: 32px 16px;">

        <table role="presentation" class="email-container" width="600" cellpadding="0" cellspacing="0" style="width:600px; max-width:600px; background-color:#ffffff; border-radius:10px; overflow:hidden;">

          <!-- Header -->
          <tr>
            <td align="center" style="background-color:#141414; padding:30px 24px;">
              <span style="font-family: Arial, Helvetica, sans-serif; font-weight:700; font-size:24px; letter-spacing:1px; color:#ffffff;">
                PI<span style="color:#FF5A1F;">HUB</span>
              </span>
            </td>
          </tr>

          <!-- Accent line -->
          <tr>
            <td style="height:3px; background-color:#FF5A1F; font-size:0; line-height:0;">&nbsp;</td>
          </tr>

          <!-- Content -->
          <tr>
            <td class="fluid-padding" style="padding:40px; color:#333333; font-size:15px; line-height:1.65;">
              {{ content|safe }}
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td style="padding:0 40px;">
              <div style="border-top:1px solid #eeeeee;"></div>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="background-color:#fafafa; padding:28px 40px 32px;">

              <!-- Social icons -->
              <table role="presentation" cellpadding="0" cellspacing="0" style="margin: 0 auto 18px;">
                <tr>
                  <td style="padding: 0 6px;">
                    <a href="https://www.facebook.com/profile.php?id=61593336062853" class="social-icon" style="display:inline-block; width:32px; height:32px; line-height:32px; border-radius:50%; background-color:#eeeeee; text-align:center;">
                      <svg width="14" height="14" viewBox="0 0 24 24" style="vertical-align:middle;"><path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06C2 17.08 5.66 21.23 10.44 22V14.96H7.9V12.06H10.44V9.84C10.44 7.32 11.93 5.93 14.22 5.93C15.31 5.93 16.45 6.13 16.45 6.13V8.62H15.19C13.95 8.62 13.56 9.39 13.56 10.18V12.06H16.34L15.89 14.96H13.56V22C18.34 21.23 22 17.08 22 12.06Z" fill="#777777"/></svg>
                    </a>
                  </td>
                  <td style="padding: 0 6px;">
                    <a href="https://www.instagram.com/prestigeinnovationhub" class="social-icon" style="display:inline-block; width:32px; height:32px; line-height:32px; border-radius:50%; background-color:#eeeeee; text-align:center;">
                      <svg width="14" height="14" viewBox="0 0 24 24" style="vertical-align:middle;"><rect x="2" y="2" width="20" height="20" rx="5.5" stroke="#777777" stroke-width="1.8" fill="none"/><circle cx="12" cy="12" r="4.4" stroke="#777777" stroke-width="1.8" fill="none"/><circle cx="17.4" cy="6.6" r="1.15" fill="#777777"/></svg>
                    </a>
                  </td>
                  <td style="padding: 0 6px;">
                    <a href="https://www.tiktok.com/@prestige.innovati7" class="social-icon" style="display:inline-block; width:32px; height:32px; line-height:32px; border-radius:50%; background-color:#eeeeee; text-align:center;">
                      <svg width="14" height="14" viewBox="0 0 24 24" style="vertical-align:middle;"><path d="M16.5 2H13.6V15.4C13.6 16.83 12.44 18 11 18C9.56 18 8.4 16.83 8.4 15.4C8.4 13.98 9.56 12.8 11 12.8C11.28 12.8 11.55 12.85 11.8 12.93V9.98C11.53 9.94 11.27 9.92 11 9.92C7.92 9.92 5.42 12.36 5.42 15.4C5.42 18.44 7.92 20.9 11 20.9C14.08 20.9 16.58 18.44 16.58 15.4V8.53C17.62 9.28 18.9 9.72 20.28 9.72V6.85C18.19 6.85 16.5 5.19 16.5 3.14V2Z" fill="#777777"/></svg>
                    </a>
                  </td>
                </tr>
              </table>

              <p style="margin:0 0 6px; font-size:12px; color:#999999; line-height:1.6;">
                You're receiving this email because you subscribed to the PIHUB newsletter.
              </p>
              <p style="margin:0 0 6px; font-size:12px;">
                <a href="{{ unsubscribe_link }}" style="color:#FF5A1F; text-decoration:none;">Unsubscribe from these emails</a>
              </p>
              <p style="margin:0; font-size:12px; color:#bbbbbb;">
                &copy; 2026 PIHUB. All rights reserved.
              </p>

            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
